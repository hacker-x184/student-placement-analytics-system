<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in to PlacePath."><title>Log in | PlacePath</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/auth.css"></head>
<body class="auth-page"><a class="skip-link" href="#main-content">Skip to main content</a><header class="auth-header"><div class="container"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">SP</span><span>PlacePath</span></a></div></header><main class="auth-shell" id="main-content"><section class="card auth-card" aria-labelledby="login-title"><p class="eyebrow">Welcome back</p><h1 id="login-title">Log in to your account</h1><p class="auth-intro">Use the same sign-in page whether you are a student or placement administrator.</p><form class="auth-form" id="login-form" novalidate><p class="form-message" data-form-message role="alert" hidden></p><div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="form-field"><label for="password">Password</label><div class="input-with-action"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="input-action" type="button" data-password-toggle="password" aria-pressed="false">Show</button></div></div><button class="button button-primary auth-submit" type="submit" data-default-text="Log in"><span data-button-text>Log in</span></button></form><p class="auth-footer">New to PlacePath? <a href="register.html">Create a student account</a></p><p class="security-note">For your protection, never share your password.</p></section></main><script type="module" src="js/auth.js"></script></body></html>
