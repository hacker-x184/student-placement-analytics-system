<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create your PlacePath student account."><title>Create account | PlacePath</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/auth.css"></head>
<body class="auth-page"><a class="skip-link" href="#main-content">Skip to main content</a><header class="auth-header"><div class="container"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">SP</span><span>PlacePath</span></a></div></header><main class="auth-shell" id="main-content"><section class="card auth-card" aria-labelledby="register-title"><p class="eyebrow">Student registration</p><h1 id="register-title">Build your placement profile</h1><p class="auth-intro">Your information is validated by the backend when you submit this form.</p><form class="auth-form" id="register-form" novalidate><p class="form-message" data-form-message role="alert" hidden></p><div class="form-grid"><div class="form-field"><label for="firstName">First name</label><input id="firstName" name="firstName" autocomplete="given-name" required></div><div class="form-field"><label for="lastName">Last name</label><input id="lastName" name="lastName" autocomplete="family-name" required></div></div><div class="form-field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="form-grid"><div class="form-field"><label for="password">Password</label><div class="input-with-action"><input id="password" name="password" type="password" autocomplete="new-password" required><button class="input-action" type="button" data-password-toggle="password" aria-pressed="false">Show</button></div></div><div class="form-field"><label for="confirmPassword">Confirm password</label><div class="input-with-action"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required><button class="input-action" type="button" data-password-toggle="confirmPassword" aria-pressed="false">Show</button></div></div></div><div class="form-grid"><div class="form-field"><label for="branch">Branch</label><input id="branch" name="branch" autocomplete="organization" placeholder="e.g. Computer Science" required></div><div class="form-field"><label for="batchYear">Batch year</label><input id="batchYear" name="batchYear" type="number" min="2000" max="2100" inputmode="numeric" required></div></div><div class="form-grid"><div class="form-field"><label for="cgpa">CGPA</label><input id="cgpa" name="cgpa" type="number" min="0" max="10" step="0.01" inputmode="decimal" required></div><div class="form-field"><label for="backlogs">Current backlogs</label><input id="backlogs" name="backlogs" type="number" min="0" step="1" inputmode="numeric" required></div></div><div class="form-grid"><div class="form-field"><label for="aptitudeScore">Aptitude score</label><input id="aptitudeScore" name="aptitudeScore" type="number" min="0" max="100" step="0.01" inputmode="decimal" required></div><div class="form-field"><label for="communicationScore">Communication score</label><input id="communicationScore" name="communicationScore" type="number" min="0" max="100" step="0.01" inputmode="decimal" required></div></div><button class="button button-primary auth-submit" type="submit" data-default-text="Create account"><span data-button-text>Create account</span></button></form><p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p></section></main><script type="module" src="js/auth.js"></script></body></html>
